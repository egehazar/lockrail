name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lockrail
          POSTGRES_PASSWORD: lockrail
          POSTGRES_DB: lockrail
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lockrail"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://lockrail:lockrail@localhost:5432/lockrail
      REDIS_URL: redis://localhost:6379/0
      LOCKRAIL_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Apply database migrations
        run: uv run alembic upgrade head

      - name: Run test suite
        run: uv run pytest tests/ -v
